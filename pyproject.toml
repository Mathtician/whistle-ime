[project]
name = "whistle-ime"
version = "0.1.0"
description = "Dictation with live preview into any Wayland text field, via an fcitx5 addon and Whistle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.scripts]
whistle-ime-backend = "whistle_ime.backend:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whistle_ime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
